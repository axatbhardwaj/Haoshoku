name: CI

on:
  pull_request:
  push:
    branches: [stable]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build test image with frozen dependencies
        run: docker build --file .github/ci/Dockerfile --tag haoshoku-ci .
      - name: Run full Bun suite in isolation
        run: python3 .github/ci/run.py haoshoku-ci
