name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Publish to NPM with trusted publishing
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$TAG"
          # The already-released v12.10.1 manifest predates the repository field.
          if [[ "$TAG" == v12.10.1 ]]; then
            npm pkg set repository.type=git repository.url="git+https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          npm publish --provenance
