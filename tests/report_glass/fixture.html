<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample report</title>
<!-- Synthetic sample for tests/report_glass/check.js; values are made up. -->
<style>
*{box-sizing:border-box}
body{font:14px/1.4 system-ui,sans-serif;color:var(--foreground,#24282c);margin:0}
main{max-width:850px;margin:auto}
h2{font-size:22px;margin:0}
h3{font-size:14px;margin:0 0 7px}
p{margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:14px 0}
article{padding:12px;background:var(--card,#f5f5f5);border:1px solid var(--border,#ddd);border-radius:8px}
.measure{display:flex;align-items:center;gap:10px}
.rail{flex:1;height:8px;background:var(--muted,#ddd);border-radius:3px}
.rail b{display:block;height:100%;border-radius:3px}
strong{min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
small{display:block;color:var(--muted-foreground,#626971)}
</style>
<!-- The glass block: remove it and the page renders solid inside a T3 embed. -->
<style id="glass">
/* biome-ignore lint/complexity/noImportantStyles: must beat the T3 embed base style */
html, body, main { background: transparent !important; }
article {
  background: color-mix(in srgb, var(--card, Canvas) 34%, transparent);
  border-color: color-mix(in srgb, var(--foreground, CanvasText) 25%, transparent);
}
.rail { background: color-mix(in srgb, var(--foreground, CanvasText) 12%, transparent); }
</style>
<main>
<h2>Sample · Before and after</h2>
<p>Synthetic values</p>
<section class="grid">
<article><h3>Average</h3>
<div class="measure"><div class="rail"><b style="width:76%;background:#c65a32"></b></div><strong>76</strong></div>
<div class="measure"><div class="rail"><b style="width:45%;background:#248b9a"></b></div><strong>45</strong></div>
</article>
<article><h3>Peak</h3>
<div class="measure"><div class="rail"><b style="width:100%;background:#c65a32"></b></div><strong>100</strong></div>
<div class="measure"><div class="rail"><b style="width:87%;background:#248b9a"></b></div><strong>87</strong></div>
</article>
</section>
<small>Bar length is the value out of 100.</small>
</main>
</html>
