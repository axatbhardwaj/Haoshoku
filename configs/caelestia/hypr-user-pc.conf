# User-owned overrides sourced last by Caelestia's hyprland.conf.
# Monitors live here so Caelestia's tree stays pristine and survives updates.
#
# Layout left -> right: DP-2 (180Hz portrait) | DP-1 (1440p, primary) | HDMI-A-1 (FHD).
# Vertical-center around y=960 (max height = DP-2 in portrait at 1920px).
# Resolution is the native landscape value; transform handles rotation.
#
# VRR policy: disabled wholesale across every output (vrr, 0). Originally only DP-2
# carried this (rotated NVIDIA + Wayland VRR is structurally broken — see
# docs/hyprland-vrr-fix.md), but extended to all outputs as a defensive default:
# DP-1 was working with VRR but exposes us to the same P-state-transition / atomic-
# commit failure path on driver updates, and HDMI-A-1's panel doesn't advertise VRR
# anyway. The PowerMizer pin (exec-once below) is what actually keeps clocks stable;
# VRR adds essentially zero perceptual benefit on this multi-monitor desk-work setup.
# Re-enable per-monitor by flipping a single `vrr, 0` → `vrr, 1` if you want to test.
monitor = DP-2, 1920x1080@179.96, 0x0, 1, transform, 1, vrr, 0
monitor = DP-1, 2560x1440@143.97, 1080x240, 1, vrr, 0
monitor = HDMI-A-1, 1920x1080@74.97, 3640x420, 1, vrr, 0

# Fallback for any monitor not matched above (also vrr off for consistency with policy).
monitor = , preferred, auto, 1, vrr, 0

# Force NVIDIA out of aggressive P-state downclocking to stop multi-monitor flicker.
exec-once = nvidia-settings -a '[gpu:0]/GPUPowerMizerMode=1'

# ─── Cross-desktop daemons (autostart) ───
# kdeconnectd: phone↔desktop sync. Hyprland doesn't process XDG autostart, so the
# /etc/xdg/autostart/org.kde.kdeconnect.daemon.desktop never fires here. Without this
# line the daemon only spawns via DBus activation when you open the GUI — meaning the
# phone won't discover this desktop until then. Received files land in $XDG_DOWNLOAD_DIR.
exec-once = /usr/bin/kdeconnectd

# Use Zed as the editor (Super+C). Arch's zed package installs the binary as `zeditor`.
# Caelestia's default (codium) isn't installed; the unbind is required because Hyprland
# adds rather than replaces binds when the same chord is bound twice.
$editor = zeditor
unbind = $kbEditor
bind = $kbEditor, exec, app2unit -- $editor

# Default terminal: Warp instead of kitty. hypr-user.conf is sourced after
# keybinds.conf, so unbind the stock Super+T then re-add it pointing at Warp.
unbind = $kbTerminal
bind = $kbTerminal, exec, app2unit -- warp-terminal

# Super+W toggles the work-Brave special workspace (DEFI named window in the Defi
# profile, which lives on disk as Brave's `Profile 1`). Caelestia's stock bind
# launched plain $browser=brave; we override to the toggle instead. To launch a
# fresh Brave window outside the toggle flow, use the app launcher or run `brave`.
unbind = $kbBrowser
bind = $kbBrowser, exec, caelestia toggle brave-work

# Messaging workspace: ws 5 lives on the rightmost monitor (HDMI-A-1), and Teams /
# Telegram always land there. `persistent` keeps ws 5 alive when empty, `default`
# makes HDMI-A-1 boot showing ws 5. `silent` on the windowrule prevents focus stealing
# when a chat client spawns a window in the background. Super+5 opens both mapped
# chat apps if either one is missing.
workspace = 5, monitor:HDMI-A-1, default:true, persistent:true
windowrule = workspace 5 silent, match:class (teams-for-linux|TelegramDesktop|org\.telegram\.desktop)
unbind = $kbGoToWs, 5
bind = $kbGoToWs, 5, exec, sh -lc 'hyprctl dispatch workspace 5; clients=$(hyprctl clients -j); printf "%s" "$clients" | jq -e '\''any(.[]; .class == "teams-for-linux")'\'' >/dev/null || hyprctl dispatch exec "[workspace 5 silent] app2unit -- teams-for-linux --gtk-version=3"; printf "%s" "$clients" | jq -e '\''any(.[]; .class == "TelegramDesktop" or .class == "org.telegram.desktop")'\'' >/dev/null || hyprctl dispatch exec "[workspace 5 silent] app2unit -- Telegram"'

# Extend Caelestia's communication-workspace catcher to include Signal and ZapZap.
# The upstream rule (rules.conf:39) only matches discord|equibop|
# vesktop|whatsapp; Hyprland evaluates windowrules additively, so these layers just
# add more class matches. ZapZap's Flatpak desktop file declares StartupWMClass=zapzap.
windowrule = workspace special:communication, match:class signal
windowrule = workspace special:communication, match:class zapzap

# Spotify uses Caelestia's music special workspace. Keep a lowercase class rule
# because the Arch desktop file advertises StartupWMClass=spotify, while upstream
# Caelestia already catches uppercase Spotify/initial title variants.
windowrule = workspace special:music, match:class spotify|Spotify
unbind = $kbMusic
bind = $kbMusic, exec, caelestia toggle music

# Notion workspace: Cohesion on real workspace 10, pinned to DP-2 (leftmost).
# Cohesion's desktop file declares StartupWMClass=cohesion, matching the runtime
# Hyprland class.
workspace = 10, monitor:DP-2, default:true, persistent:true
windowrule = workspace 10 silent, match:class cohesion

# Rebind Super+0 to go to workspace 10. If Cohesion has no window yet, launch it
# into workspace 10. Same for Super+Alt+0 for moving a window there. Direct hyprctl
# dispatch bypasses wsaction.fish to keep Super+0 stable regardless of workspace group.
unbind = $kbGoToWs, 0
bind = $kbGoToWs, 0, exec, sh -lc 'hyprctl dispatch workspace 10; hyprctl clients -j | jq -e '\''any(.[]; .class == "cohesion")'\'' >/dev/null || hyprctl dispatch exec "[workspace 10 silent] app2unit -- cohesion"'
unbind = $kbMoveWinToWs, 0
bind = $kbMoveWinToWs, 0, exec, hyprctl dispatch movetoworkspace 10

# ws 7 is no longer pinned: DEFI (work brave) moved to special:brave-work, summoned
# via Super+W. ws 7 returns to being a free-roaming scratch slot. The
# initial_title-based windowrule was unreliable (Brave's named-window title is
# applied post-spawn) — replaced with cli.json's live-title selector.

# Steam workspace: ws 2 on DP-1 (primary), persistent. Catches the Steam launcher and
# its satellite windows (friends list, downloads, etc.) which all share class=Steam.
# Game windows have their own per-title classes (steam_app_<id>, gamescope, or the
# game's own name) — they're NOT caught by this rule and will spawn wherever your
# focus is. To force a game to ws 2, manually `Super+Alt+2` after it launches.
workspace = 2, monitor:DP-1, persistent:true
windowrule = workspace 2 silent, match:class ^[Ss]team$
unbind = $kbGoToWs, 2
bind = $kbGoToWs, 2, exec, sh -lc 'hyprctl dispatch workspace 2; hyprctl clients -j | jq -e '\''any(.[]; .class | test("^[Ss]team$"))'\'' >/dev/null || hyprctl dispatch exec "[workspace 2 silent] app2unit -- steam"'

# "Minimize" approximations via a stash special workspace. Hyprland has no true
# minimize, but moving a window to a special workspace gives the same UX (hidden,
# restorable). Super+H stashes the focused window without yanking focus; Super+Shift+H
# toggles the stash overlay so you can see / interact with what's stashed.
bind = Super, H, movetoworkspacesilent, special:stash
bind = Super+Shift, H, togglespecialworkspace, stash

# 1Password as a roaming special workspace. 1Password autostarts in tray mode
# (--silent), so the first Super+O call opens its main window via IPC; subsequent
# presses toggle the overlay visibility on whichever monitor is focused. The windowrule
# routes any 1Password window into the special workspace so toggling reveals it.
# NOTE: runtime WM class is lowercase "1password" despite the .desktop file declaring
# "1Password" — sourced from `hyprctl clients`, not the .desktop hint.
windowrule = workspace special:1password, match:class 1password
bind = Super, O, exec, caelestia toggle 1password

# Brave Personal profile (xzat — Brave's `Default` directory) as a special workspace,
# identified by the FLUX named window. We match in cli.json by class=brave-browser +
# title=Flux because initial_title is generic ("New tab - Brave") and Brave applies
# the named title post-spawn. The cli.json's move_client uses the *current* title,
# so toggling moves FLUX to special:brave-personal correctly.
#
# Profile-dir mapping (Brave numbers profile dirs in creation order, so renames don't
# update them — easy to misread): `Default` = xzat = personal; `Profile 1` = Defi = work.
windowrule = workspace special:brave-personal, match:class brave-browser, match:title Flux
# Caelestia's global opacity rule skips fullscreen windows. These named Brave
# special workspaces should stay visually consistent even if one profile restores
# a fullscreen state.
windowrule = opacity $windowOpacity override $windowOpacity override $windowOpacity override, match:class brave-browser, match:title Flux
bind = Super, B, exec, caelestia toggle brave-personal

# Brave Work profile (Defi) as its own special workspace. Super+W launches/toggles it;
# the windowrule keeps externally opened Defi windows on the same special workspace.
windowrule = workspace special:brave-work, match:class brave-browser, match:title Defi
windowrule = opacity $windowOpacity override $windowOpacity override $windowOpacity override, match:class brave-browser, match:title Defi

# Agents special workspace: a Warp window running the claude | codex horizontal split,
# launched from cli.json's agents toggle via `warp://tab_config/agents?new_window=true`.
# Warp has no per-window WM class (every window is dev.warp.Warp), so route by the tab
# config's title ("agents"). Super+A forces the leftmost portrait monitor (DP-2) first so
# the workspace always lands there regardless of current focus.
windowrule = workspace special:agents, match:class dev\.warp\.Warp, match:title agents
bind = Super, A, exec, hyprctl dispatch focusmonitor DP-2 && caelestia toggle agents

# Super+D (communication) always opens on the rightmost monitor (HDMI-A-1). Stock
# caelestia binds $kbCommunication in keybinds.conf; unbind it and re-add with a
# focusmonitor prefix so the special workspace consistently lands on the right screen.
unbind = $kbCommunication
bind = $kbCommunication, exec, hyprctl dispatch focusmonitor HDMI-A-1 && caelestia toggle communication

# Pin ws 1 and ws 3 to DP-1 (primary 1440p). ws 1 is the boot default; ws 3 is just
# anchored + persistent (no auto-routed app — was Vesktop, but Vesktop moved to ws 6).
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 3, monitor:DP-1, persistent:true

# Vesktop workspace: ws 4 on HDMI-A-1 (right, 1080p), persistent. Renumbered from
# ws 6 → ws 4 to keep the sequence contiguous (0, 1, 2, 3, 4, 5 — no gap).
workspace = 4, monitor:HDMI-A-1, persistent:true
windowrule = workspace 4 silent, match:class vesktop
unbind = $kbGoToWs, 4
bind = $kbGoToWs, 4, exec, sh -lc 'hyprctl dispatch workspace 4; hyprctl clients -j | jq -e '\''any(.[]; .class == "vesktop")'\'' >/dev/null || hyprctl dispatch exec "[workspace 4 silent] app2unit -- vesktop"'

# Per-monitor screenshot. Super+Print captures the focused monitor via hyprshot
# (saves to ~/Pictures, copies to clipboard, sends a notification). Caelestia's stock
# Print bind (keybinds.conf) only does a full all-monitors capture. Super+Print isn't
# bound by stock Caelestia, so this is a plain additive bind — no unbind needed. Kept
# here rather than in the repo-tracked keybinds.conf so it survives `caelestia` updates.
bind = Super, Print, exec, hyprshot -m output -m active  # Capture focused monitor > clipboard
