# User-owned overrides sourced last by Caelestia's hyprland.conf — LAPTOP variant.
# Single internal HiDPI panel, no external monitors used ~99% of the time.
# The catch-all monitor line covers the rare external-output case (TV, projector).

# Internal panel: 2880x1800 @ 120Hz, scale 1.6 (logical ~1800x1125), no rotation.
# ASUS Meteor Lake laptop with Intel Arc iGPU — driven entirely via i915/xe.
monitor = eDP-1, 2880x1800@120, 0x0, 1.6

# Fallback for occasional external (TV, projector, dock). Auto-positioned right
# of eDP-1 at its preferred mode.
monitor = , preferred, auto, 1

# (No NVIDIA exec-once: this laptop has Intel iGPU only.)

# ─── Cross-desktop daemons (autostart) ───
# kdeconnectd: phone↔desktop sync. Hyprland doesn't process XDG autostart, so the
# /etc/xdg/autostart/org.kde.kdeconnect.daemon.desktop never fires here. Without this
# line the daemon only spawns via DBus activation when you open the GUI — meaning the
# phone won't discover this desktop until then. Received files land in $XDG_DOWNLOAD_DIR.
exec-once = /usr/bin/kdeconnectd

# ─── Portable app shortcuts (mirrors hypr-user-pc.conf) ───

# Use Zed as the editor (Super+C). Arch's zed package installs the binary as `zeditor`.
$editor = zeditor
unbind = $kbEditor
bind = $kbEditor, exec, app2unit -- $editor

# Default terminal: Warp instead of kitty. hypr-user.conf is sourced after
# keybinds.conf, so unbind the stock Super+T then re-add it pointing at Warp.
unbind = $kbTerminal
bind = $kbTerminal, exec, app2unit -- warp-terminal

# Default file manager: Dolphin instead of Caelestia's stock Thunar.
# The stock Super+E bind is expanded before this file is sourced, so rebind it.
$fileExplorer = dolphin
unbind = $kbFileExplorer
bind = $kbFileExplorer, exec, app2unit -- $fileExplorer

# Caelestia maps Super+Shift+M to speaker mute; this variant keeps Super+M for
# music and uses the shifted chord for microphone mute instead.
unbind = Super+Shift, M
bindl = Super+Shift, M, exec, /home/xzat/.local/bin/mic-toggle

# Super+W toggles the work-Brave special workspace (DEFI named window in the Defi
# profile, which lives on disk as Brave's `Profile 1`).
unbind = $kbBrowser
bind = $kbBrowser, exec, caelestia toggle brave-work

# Messaging workspace. `persistent` keeps ws 5 alive when empty. `default:true`
# mirrors the PC variant's default workspace set; without monitor pins, laptop
# maps those defaults onto the active single output. `silent` on the windowrule
# prevents focus stealing when a chat client spawns a window in the background.
# Super+5 opens both mapped chat apps if either one is missing.
workspace = 5, default:true, persistent:true
windowrule = workspace 5 silent, match:class (teams-for-linux|TelegramDesktop|org\.telegram\.desktop)
unbind = $kbGoToWs, 5
bind = $kbGoToWs, 5, exec, sh -lc 'hyprctl dispatch workspace 5; clients=$(hyprctl clients -j); printf "%s" "$clients" | jq -e '\''any(.[]; .class == "teams-for-linux")'\'' >/dev/null || hyprctl dispatch exec "[workspace 5 silent] app2unit -- teams-for-linux --gtk-version=3"; printf "%s" "$clients" | jq -e '\''any(.[]; .class == "TelegramDesktop" or .class == "org.telegram.desktop")'\'' >/dev/null || hyprctl dispatch exec "[workspace 5 silent] app2unit -- Telegram"'

# Extend Caelestia's special:communication windowrule for Signal + the WhatsApp Web
# Brave app (replacing the ZapZap Flatpak). The Brave app reports class
# brave-web.whatsapp.com__-Default.
windowrule = workspace special:communication, match:class signal
windowrule = workspace special:communication, match:class brave-web\.whatsapp\.com__-Default

# Spotify uses Caelestia's music special workspace.
windowrule = workspace special:music, match:class spotify|Spotify
unbind = $kbMusic
bind = $kbMusic, exec, caelestia toggle music

# Notion workspace: Brave web app on real workspace 10.
workspace = 10, default:true, persistent:true
windowrule = workspace 10 silent, match:class brave-dcokohelbbehjlcjjfmhfbpdgfjcoopf-Default

# Rebind Super+0 to go to workspace 10. If Notion has no window yet, launch it
# into workspace 10.
unbind = $kbGoToWs, 0
bind = $kbGoToWs, 0, exec, sh -lc 'hyprctl dispatch workspace 10; addr=$(hyprctl clients -j | jq -er '\''.[] | select(.class == "brave-dcokohelbbehjlcjjfmhfbpdgfjcoopf-Default") | .address'\'' | head -n1); if [ -n "$addr" ]; then hyprctl dispatch movetoworkspacesilent "10,address:$addr"; else hyprctl dispatch exec "[workspace 10 silent] app2unit -- gtk-launch brave-dcokohelbbehjlcjjfmhfbpdgfjcoopf-Default"; fi'
unbind = $kbMoveWinToWs, 0
bind = $kbMoveWinToWs, 0, exec, hyprctl dispatch movetoworkspace 10

# Steam workspace. Catches the Steam launcher and its satellite windows (friends
# list, downloads, etc.) which all share class=Steam.
workspace = 2, persistent:true
windowrule = workspace 2 silent, match:class ^[Ss]team$
unbind = $kbGoToWs, 2
bind = $kbGoToWs, 2, exec, sh -lc 'hyprctl dispatch workspace 2; hyprctl clients -j | jq -e '\''any(.[]; .class | test("^[Ss]team$"))'\'' >/dev/null || hyprctl dispatch exec "[workspace 2 silent] app2unit -- steam"'

# "Minimize" approximations via a stash special workspace.
bind = Super, H, movetoworkspacesilent, special:stash
bind = Super+Shift, H, togglespecialworkspace, stash

# 1Password as a roaming special workspace.
windowrule = workspace special:1password, match:class 1password
bind = Super, O, exec, caelestia toggle 1password

# Brave profile windows each live in their own special workspace.
windowrule = workspace special:brave-personal, match:class brave-browser, match:title Flux
windowrule = opacity $windowOpacity override $windowOpacity override $windowOpacity override, match:class brave-browser, match:title Flux
bind = Super, B, exec, caelestia toggle brave-personal
windowrule = workspace special:brave-work, match:class brave-browser, match:title Defi
windowrule = opacity $windowOpacity override $windowOpacity override $windowOpacity override, match:class brave-browser, match:title Defi

# Agents split (claude | codex) in a Warp window (tab config agents.toml). Super+A runs the
# agents-toggle guard script — show/hide special:agents if occupied, else spawn warp-terminal
# pinned to special:agents (the script owns placement; Warp's title drifts off "agents" once a
# pane exits). No focusmonitor here: the laptop has a single eDP-1 panel.
unbind = Super, A
bind = Super, A, exec, /home/xzat/.local/bin/agents-toggle

# Persistent workspaces. These intentionally have no monitor pins on laptop.
workspace = 1, default:true, persistent:true
workspace = 3, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
unbind = $kbGoToWs, 6
bind = $kbGoToWs, 6, exec, hyprctl dispatch workspace 6
unbind = $kbGoToWs, 7
bind = $kbGoToWs, 7, exec, /home/xzat/.local/bin/warp-workspace-7

# Discord workspace. Official client (class `discord`) replaces Vesktop; the ws 4
# pin overrides Caelestia's stock special:communication rule, which also matches
# `discord`, because hypr-user.conf is sourced last.
workspace = 4, persistent:true
windowrule = workspace 4 silent, match:class discord
unbind = $kbGoToWs, 4
bind = $kbGoToWs, 4, exec, sh -lc 'hyprctl dispatch workspace 4; hyprctl clients -j | jq -e '\''any(.[]; .class == "discord")'\'' >/dev/null || hyprctl dispatch exec "[workspace 4 silent] app2unit -- discord"'

# Active-output screenshot. Kept aligned with the PC binding; on laptop this
# captures the focused internal panel or the active external output when attached.
bind = Super, Print, exec, hyprshot -m output -m active  # Capture focused monitor > clipboard

# ─── Super/Meta tap-to-launch fix (Hyprland ≥0.55.3, PR #14743) ───
# 0.55.3 changed bind dispatch so ALL binds matching a key event fire in definition
# order. Stock keybinds.conf defines launcher (Super_L) BEFORE catchall, so a bare
# Super tap fires launcher (interrupted=false) then catchall (interrupted=true); the
# shell only opens the launcher on Super RELEASE if not interrupted, so every tap
# self-cancels and nothing happens. Fix: re-add both in REVERSED order — interrupt
# first, then launcher's onPressed resets the flag last. Clean tap -> opens; Super+combo
# -> still interrupted. Mouse interrupts (stock keybinds.conf) left untouched. These
# binds live in the `global` submap, hence the wrapper. Portable keybind — keep this
# block identical in hypr-user-pc.conf. Revert when upstream fixes it:
# https://github.com/caelestia-dots/caelestia/issues/436
submap = global
unbind = Super, catchall
unbind = Super, Super_L
bindin = Super, catchall, global, caelestia:launcherInterrupt
bindi = Super, Super_L, global, caelestia:launcher
submap = reset
