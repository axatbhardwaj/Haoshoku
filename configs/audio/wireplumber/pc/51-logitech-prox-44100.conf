# linux-lossless-setup (Notion runbook) — THE fix: pins the G PRO X sink to 44.1 kHz. Recreated 2026-05-21.
monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "alsa_output.usb-Logitech_PRO_X_000000000000-00.analog-stereo"
            }
        ]
        actions = {
            update-props = {
                audio.rate          = 44100
                audio.allowed-rates = [ 44100 ]
            }
        }
    }
]
