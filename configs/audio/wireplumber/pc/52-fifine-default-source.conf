# Pin the FIFINE USB mic as the default capture source. The Lenovo webcam mic actually
# carries a higher stock priority.session (2109) than the FIFINE (2100), so whenever
# WirePlumber's configured-default state is cleared (fresh setup, state reset, or a new
# device enumerating) the default *input* falls to the webcam instead of the FIFINE.
# Bumping the FIFINE to 3000 — well above the ~2000-2100 source band — makes it the
# default capture source deterministically. Raising a *source* priority this high is
# safe; the "keep sinks below 1500" caveat only applies to sinks (monitor-as-source).
# Created 2026-05-31. Matches the exact node.name; update it if the USB serial changes.
monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "alsa_input.usb-MV-SILICON_fifine_Microphone_20190808-00.mono-fallback"
            }
        ]
        actions = {
            update-props = {
                priority.session = 3000
            }
        }
    }
]
