# linux-lossless-setup (Notion runbook) — pulse.rules future-proofing (currently a no-op). Recreated 2026-05-21.
pulse.rules = [
    {
        matches = [
            { node.name = "audio-src" }
            { application.process.binary = "spotify" }
        ]
        actions = {
            update-props = {
                node.rate    = "1/44100"
                node.latency = "1024/44100"
            }
        }
    }
]
