general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr-ocean/wallpapers/aurora_borealis_by_gaudibuendia_dajesxg.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3
    brightness = 1.0
    vibrancy = 0.21
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    outer_color = rgba(00a9a5ee)
    inner_color = rgba(00000099)
    font_color = rgb(d2dce6)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    rounding = 12
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(d2dce6ee)
    font_size = 120
    font_family = Inter
    position = 0, 220
    halign = center
    valign = center
}
