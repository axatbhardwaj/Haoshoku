# Translated from kde_shortcuts.kksrc — DO NOT EDIT BY HAND
# Regenerate with: bun haoshoku.js --hyprland-keybinds

bind = SUPER, L, exec, hyprlock
bind = CTRL_ALT, DEL, exec, hyprctl dispatch exit
bind = SUPER, D, exec, hyprctl dispatch togglespecialworkspace
bind = SUPER_ALT, DOWN, movefocus, d
bind = SUPER_ALT, LEFT, movefocus, l
bind = SUPER_ALT, RIGHT, movefocus, r
bind = SUPER_ALT, UP, movefocus, u
bind = CTRL, F1, workspace, 1
bind = CTRL, F2, workspace, 2
bind = CTRL, F3, workspace, 3
bind = CTRL, F4, workspace, 4
bind = ALT, F4, killactive
bind = SUPER, PGUP, fullscreen, 1
bind = SUPER, PGDOWN, movetoworkspacesilent, special

