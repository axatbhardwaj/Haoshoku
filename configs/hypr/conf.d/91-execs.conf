# Hyprland-native daemon launchers for the Ocean overlay.
# Distinct from configs/hypr/conf.d/40-autostart.conf (Phase 4), which holds
# KDE-translated user autostarts. These execs start daemons whose config
# files we ship in configs/hypr/ itself.
#
# sh -c wrapper ensures ~ / $HOME expansion (Hyprland's exec-once uses
# execvp by default, which does not expand shell metacharacters).
exec-once = sh -c "hyprpaper -c $HOME/.config/hypr-ocean/hyprpaper.conf"
