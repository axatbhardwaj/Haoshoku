# Translucent + gaussian blur tuned to feel like KDE Glass
# These values mirror what 4v3ngR/kwin-effects-glass renders under KDE Plasma 6.
# Phase 2 ships starting values; user tunes live in Task 2.7 visual verification.
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        noise = 0.0117
        contrast = 1.3
        brightness = 1.0
        vibrancy = 0.21
        vibrancy_darkness = 0.0
        xray = false
        ignore_opacity = true
        special = true
        popups = true
    }

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(1a1a1a99)
    }
}
