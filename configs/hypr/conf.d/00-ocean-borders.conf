# Ocean palette borders (overrides Caelestia defaults)
# Source palette: configs/kde/color-schemes/Ocean.colors
#   DecorationFocus    = 0,169,165   -> #00a9a5  (teal accent)
#   BackgroundAlternate= 29,153,243  -> #1d99f3  (bright blue)
#   BackgroundNormal   = 18,21,31    -> #12151f  (dark navy)
general {
    col.active_border = rgba(00a9a5ee) rgba(1d99f3ee) 45deg
    col.inactive_border = rgba(12151faa)
    border_size = 2
    gaps_in = 4
    gaps_out = 8
}
