# Default Ocean wallpaper — aurora over dark sky (teal/blue palette match).
# Modern hyprpaper syntax (block-form). Legacy preload=/wallpaper=monitor,path
# was removed from upstream hyprpaper in recent versions and will not parse.
#
# Loaded by `exec-once = hyprpaper -c ~/.config/hypr-ocean/hyprpaper.conf` from
# configs/hypr/conf.d/91-execs.conf. Swap by editing this file's `path = ...`,
# then re-running `bun haoshoku.js --hyprland` to sync.
splash = false
ipc = on

wallpaper {
    monitor =
    path = ~/.config/hypr-ocean/wallpapers/aurora_borealis_by_gaudibuendia_dajesxg.jpg
    fit_mode = cover
}
