# Default Ocean wallpaper — aurora over dark sky (teal/blue palette match)
# File is copied from deskback/ to ~/.config/hypr-ocean/wallpapers/ by syncHyprlandOverlay.
# Swap by editing this file then running `bun haoshoku.js --hyprland`.
preload = ~/.config/hypr-ocean/wallpapers/aurora_borealis_by_gaudibuendia_dajesxg.jpg
wallpaper = ,~/.config/hypr-ocean/wallpapers/aurora_borealis_by_gaudibuendia_dajesxg.jpg
splash = false
ipc = on
