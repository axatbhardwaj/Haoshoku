include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family      0xProto Nerd Font Mono
font_size        11

# The active Omarchy theme owns colors. Cloned Omarchy 4 themes drop
# kitty.conf, so background opacity lives here: glyphs stay fully opaque
# while Hyprland blurs through the terminal background.
background_opacity   0.70
background_blur      1

# Hyprland tiles terminal windows, so keep the client borderless with compact padding.
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

# Claude Code: shift+enter inserts a newline without submitting
map shift+enter send_text all \x1b\r
