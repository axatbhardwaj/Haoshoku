# Font (matches former ghostty config)
font_family      0xProto Nerd Font Mono
font_size        11

# Background / opacity / blur
# background_blur is honored by KWin via _KDE_NET_WM_BLUR_BEHIND_REGION.
# Set to 0 to disable; values 1-64 set the blur radius.
background_opacity   0.85
background_blur      1

# Cursor + selection
cursor                 #FFCC00
selection_background   #717CB4
selection_foreground   #EEFFFF

# Base background / foreground (deep-ocean)
background       #0F111A
foreground       #babed8

# Normal colors (deep-ocean palette)
color0  #546E7A
color1  #f07178
color2  #C3E88D
color3  #FFCB6B
color4  #82AAFF
color5  #C792EA
color6  #89DDFF
color7  #FFFFFF

# Bright colors
color8  #464B5D
color9  #f07178
color10 #C3E88D
color11 #FFCB6B
color12 #82AAFF
color13 #C792EA
color14 #89DDFF
color15 #FFFFFF

# Claude Code: shift+enter inserts a newline without submitting
map shift+enter send_text all \x1b\r
