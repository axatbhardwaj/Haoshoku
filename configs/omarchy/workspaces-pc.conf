# Haoshoku workspace behavior for Omarchy. Visual configuration remains Omarchy-owned.
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:HDMI-A-1, persistent:true
workspace = 5, monitor:HDMI-A-1, default:true, persistent:true
workspace = 6, monitor:DP-2, persistent:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-1, persistent:true
workspace = 9, monitor:HDMI-A-1, persistent:true
workspace = 10, monitor:DP-2, persistent:true

exec-once = haoshoku-special-workspace numbered-login 7 kitty

windowrule = workspace 2 silent, match:class ^[Ss]team$
windowrule = workspace 4 silent, match:class ^(discord|vesktop)$
windowrule = workspace 5 silent, match:class ^(teams-for-linux|TelegramDesktop|org\.telegram\.desktop)$
windowrule = workspace 7 silent, match:class ^haoshoku-ws7$
windowrule = workspace 10 silent, match:class ^brave-www\.notion\.so__-Default$
windowrule = workspace special:x, match:class ^brave-x\.com__-Default$
windowrule = workspace special:youtube, match:class ^brave-youtube\.com__-Default$
windowrule = workspace special:crunchyroll, match:class ^brave-www\.crunchyroll\.com__-Default$
windowrule = workspace special:reanime, match:class ^brave-reanime\.to__home-Default$
windowrule = workspace special:haki, match:class ^haoshoku-haki$
windowrule = workspace special:assistants, match:class ^com\.anthropic\.Claude$
windowrule = workspace special:assistants, match:class ^brave-chatgpt\.com__-Default$
windowrule = workspace special:music, match:class ^[Ss]potify$
windowrule = workspace special:1password, match:class ^1[Pp]assword$
windowrule = workspace special:communication, match:class ^(signal|Signal|brave-web\.whatsapp\.com__-Default)$
windowrule = workspace special:browser-flux, match:class ^chromium-flux$
windowrule = workspace special:browser-defi, match:class ^chromium-defi$
windowrule = border_color rgb(9762e2) rgb(9762e2), match:class ^chromium-defi$

# Portal file dialogs open TILED on the normal workspace underneath, so a
# revealed special workspace draws over them and they appear to vanish -- the
# upload or download picker is focused but invisible. Verified by driving
# org.freedesktop.portal.Desktop over D-Bus: the window is class
# xdg-desktop-portal-gtk, floating=false, on the underlying workspace.
#
# `pin` is the load-bearing rule: a pinned floating window renders above
# whichever workspace is showing, special included. Verified live -- the dialog
# stayed hidden=false while special:communication was displayed on the same
# monitor. `float` is required because pin only applies to floating windows.
#
# Scoped to the portal only. Nautilus itself (Super+E) is a different class and
# must not be pinned. A pinned dialog follows workspace switches until dismissed.
windowrule = float on, match:class ^xdg-desktop-portal-gtk$
windowrule = pin on, match:class ^xdg-desktop-portal-gtk$
windowrule = center on, match:class ^xdg-desktop-portal-gtk$

# These are additive supersets of Omarchy's stock Super+number workspace binds.
bindd = SUPER, code:11, Workspace 2 and Steam, exec, haoshoku-special-workspace numbered 2 steam
bindd = SUPER, code:13, Workspace 4 and Discord, exec, haoshoku-special-workspace numbered 4 discord
bindd = SUPER, code:14, Workspace 5 and chat, exec, haoshoku-special-workspace numbered 5 communication-numbered
bindd = SUPER, code:16, Workspace 7 and Kitty, exec, haoshoku-special-workspace numbered 7 kitty
bindd = SUPER, code:19, Workspace 10 and Notion, exec, haoshoku-special-workspace numbered 10 notion

unbind = SUPER, G
bindd = SUPER CTRL SHIFT, G, Toggle window grouping, togglegroup
unbind = SUPER, O
bindd = SUPER CTRL SHIFT, O, Pop window out (float & pin), exec, omarchy-hyprland-window-pop
unbind = SUPER, S
bindd = SUPER CTRL SHIFT, S, Toggle scratchpad, togglespecialworkspace, scratchpad

bindd = SUPER, A, Show/focus/hide Haki session, exec, haoshoku-special-workspace haki
bindd = SUPER, I, Show/focus/hide AI assistants workspace, exec, haoshoku-special-workspace assistants
bindd = SUPER, M, Show/focus/hide music workspace, exec, haoshoku-special-workspace music
bindd = SUPER, O, Show/focus/hide 1Password workspace, exec, haoshoku-special-workspace 1password
bindd = SUPER, G, Show/focus/hide communication workspace, exec, haoshoku-special-workspace communication
bindd = SUPER, B, Toggle Flux Brave Origin workspace, exec, haoshoku-special-workspace browser-toggle flux
bindd = SUPER, D, Toggle DeFi Brave Origin workspace, exec, haoshoku-special-workspace browser-toggle defi
bindd = SUPER, Y, Show/focus/hide YouTube workspace, exec, haoshoku-special-workspace youtube
bindd = SUPER, R, Show/focus/hide Crunchyroll workspace, exec, haoshoku-special-workspace crunchyroll
bindd = SUPER, F, Show/focus/hide Re:ANIME workspace, exec, haoshoku-special-workspace reanime
bindd = SUPER, S, Toggle stash workspace, togglespecialworkspace, stash
bindd = SUPER SHIFT, X, Show/focus/hide X workspace, exec, haoshoku-special-workspace x
bindd = SUPER SHIFT, S, Stash focused window, movetoworkspacesilent, special:stash
