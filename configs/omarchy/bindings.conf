# Application bindings
#
# Custom shortcuts favour SUPER + single key. Where that slot held an Omarchy
# default, the default is unbound and re-bound at SUPER CTRL SHIFT + the same
# key -- the slot its replacement vacated, so nothing is lost.
#
# An `unbind` before each override is load-bearing: Hyprland keeps BOTH
# bindings on a key otherwise and fires them together.

# --- Omarchy defaults displaced by the bindings below ---
unbind = SUPER, F
bindd = SUPER CTRL SHIFT, F, Full screen, fullscreen, 0
unbind = SUPER, P
bindd = SUPER CTRL SHIFT, P, Pseudo window, pseudo
unbind = SUPER, T
bindd = SUPER CTRL SHIFT, T, Toggle window floating/tiling, togglefloating

# The X launcher is superseded, not relocated: the workspace toggle owns it.
unbind = SUPER SHIFT, X

# --- Applications ---
unbind = SUPER, RETURN
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, T, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, Z, Zed, exec, omarchy-launch-or-focus ^dev\.zed\.Zed$ "uwsm-app -- zeditor"
bindd = SUPER, Q, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"

unbind = SHIFT SUPER, RETURN
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
unbind = ALT SHIFT SUPER, F
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
unbind = SHIFT SUPER, B
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
unbind = ALT SHIFT SUPER, B
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
unbind = ALT SHIFT SUPER, M
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
unbind = SHIFT SUPER, D
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
unbind = SHIFT SUPER, W
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

# Deploy restores the stock bindings template, so personal deletion alone is not
# durable: these stock launchers are deliberately deleted AND unbound here.
# Three are actively harmful if resurrected because workspaces.conf routes them
# into hidden special workspaces:
#   SUPER SHIFT M      Spotify   -- launches invisibly into special:music
#   SUPER SHIFT SLASH  1Password -- launches invisibly into special:1password
#   SUPER SHIFT G      Signal    -- focuswindow reveals special:communication
#     with no way to dismiss it, which reads as a broken workspace toggle.
# SUPER SHIFT X is likewise deleted-and-unbound above because its special
# workspace toggle owns that key.
unbind = SUPER ALT, RETURN
unbind = SUPER SHIFT, F
unbind = SUPER SHIFT, M
unbind = SUPER SHIFT, N
unbind = SUPER SHIFT, G
unbind = SUPER SHIFT, O
unbind = SUPER SHIFT, SLASH
unbind = SUPER SHIFT, E
unbind = SUPER SHIFT, Y
unbind = SUPER SHIFT, P

# --- Web apps ---
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"

unbind = SHIFT SUPER, A
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
unbind = ALT SHIFT SUPER, A
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
unbind = SHIFT SUPER, C
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
unbind = ALT SHIFT SUPER, G
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
unbind = ALT SHIFT SUPER, X
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# SUPER CTRL SHIFT + G belongs to the communication special workspace (Signal +
# WhatsApp on HDMI-A-1), bound in haoshoku-workspaces.conf. Google Messages used
# the same modifier set spelled SUPER SHIFT CTRL, so one keypress fired both
# binds and toggled the workspace back off. Launch Google Messages from Walker.
unbind = CTRL SHIFT SUPER, G

