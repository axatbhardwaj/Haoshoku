# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# Restored by Haoshoku; all other Hyprland configuration remains Omarchy-owned.

env = GDK_SCALE,2
monitor=,preferred,auto,auto

# Actual layout, left to right. DP-2 is rotated 90 degrees clockwise.
monitor = DP-2,     1920x1080@179.96, 0x0,      1, transform, 1
monitor = DP-1,     2560x1440@143.97, 1080x240, 1
monitor = HDMI-A-1, 1920x1080@74.97,  3640x420, 1
